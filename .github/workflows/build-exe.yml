name: Build Windows Executable (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish generated .exe files to a GitHub Release'
        required: false
        default: false
        type: boolean
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build & Package Windows .EXE
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Compile and Package Windows .EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes electron-builder --win --x64 -c.win.target=nsis,portable

      - name: Verify generated Windows binaries
        shell: pwsh
        run: |
          Write-Host "Checking dist_electron directory contents:"
          Get-ChildItem -Path dist_electron -Filter *.exe | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 2)
            Write-Host "Found executable: $($_.Name) ($sizeMB MB)"
          }

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ahmed-Reaction-Studio-Windows-EXE
          path: dist_electron/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event.inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: dist_electron/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
